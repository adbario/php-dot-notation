name: tests

# Run on pushes to the main branch and on all pull requests.
on:
  push:
    branches: ["3.x"]
  pull_request:

# Restrict the GITHUB_TOKEN to read-only repository access.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs when a pull request is updated, but let
# pushed-branch runs finish so 3.x always has a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental == true }}
    # Run the test suite on every supported PHP version. One version
    # (analysis: true) additionally runs coding standards, static analysis
    # and coverage reporting; fail-fast is off so all versions report.
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]
        # Keep analysis on a stable PHP version and allow the newest version
        # to fail while it is still experimental.
        include:
          - php: "8.5"
            analysis: true
          - php: "8.6"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Xdebug is only needed for coverage on the analysis job.
          coverage: ${{ matrix.analysis && 'xdebug' || 'none' }}

      - name: Install dependencies with Composer
        uses: ramsey/composer-install@v4

      - name: Coding standards
        if: matrix.analysis
        run: vendor/bin/phpcs

      - name: Static analysis
        if: matrix.analysis
        run: vendor/bin/phpstan

      - name: Tests
        # The analysis job runs the coverage variant below instead.
        if: matrix.analysis != true
        run: vendor/bin/phpunit

      - name: Tests with coverage
        if: matrix.analysis
        run: vendor/bin/phpunit --coverage-clover clover.xml

      - name: Upload coverage results to Coveralls
        if: matrix.analysis
        uses: coverallsapp/github-action@v2
        with:
          file: clover.xml

  # Single summary check to mark as required in the branch rules, so the
  # PHP matrix can change without updating repository settings. always()
  # keeps it from being skipped (and treated as passing) when a test fails.
  all-tests:
    name: All tests passed
    if: always()
    needs: tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        run: test "${{ needs.tests.result }}" = "success"
